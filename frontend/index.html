<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Inventário/Doação - ONG/Igreja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {
      flex-grow: 1;
      max-width: 900px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    label { display: block; margin-top: 1rem; }
    input[type=text], input[type=password], select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 1.2rem;
      padding: 0.6rem 1.2rem;
      border: none;
      background: #27ae60;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #219150; }
    .hidden { display: none; }
    nav { margin-bottom: 1.5rem; text-align: center; }
    nav button { margin: 0 0.5rem; background: #2980b9; }
    nav button.active { background: #1abc9c; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem;
      text-align: left;
    }
    th { background-color: #f0f0f0; }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #444;
      background: #ecf0f1;
    }
    .error {
      color: red;
      margin-top: 0.5rem;
      font-weight: bold;
    }
    .row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .row button { margin-top: 0; }
    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Sistema de Inventário/Doação</h1>
  <p>Ação Social e Desenvolvimento Comunitário</p>
</header>

<main>
  <section id="login-section">
    <h2>Login</h2>
    <label for="username">Usuário:</label>
    <input type="text" id="username" placeholder="Digite seu usuário" />
    <label for="password">Senha:</label>
    <input type="password" id="password" placeholder="Digite sua senha" />
    <button id="login-btn">Entrar</button>
    <p id="login-error" class="error hidden">Usuário ou senha inválidos.</p>
  </section>

  <section id="system-section" class="hidden">
    <nav>
      <button id="btn-inventory" class="active">Cadastro</button>
      <button id="btn-report">Relatório</button>
      <button id="btn-logout" style="background:#c0392b;">Sair</button>
    </nav>

    <div id="inventory-div">
      <h2>Cadastro de Itens</h2>

      <div class="row">
        <div>
          <label for="item-name">Nome do item:</label>
          <input type="text" id="item-name" placeholder="Ex: Arroz, Camiseta, Sabonete" />
        </div>

        <div>
          <label for="item-category">Categoria:</label>
          <select id="item-category">
            <option value="Alimentos">Alimentos</option>
            <option value="Roupas">Roupas</option>
            <option value="Higiene">Higiene</option>
          </select>
        </div>

        <div>
          <label for="item-quantity">Quantidade:</label>
          <input type="text" id="item-quantity" placeholder="Ex: 10" />
        </div>

        <div>
          <button id="save-item">Salvar</button>
        </div>
      </div>

      <h3>Itens cadastrados</h3>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Quantidade</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="inventory-table"></tbody>
      </table>
    </div>

    <div id="report-div" class="hidden">
      <h2>Relatório / Filtro em tempo real</h2>

      <div class="top-actions">
        <div>
          <label for="filter-category">Filtrar por categoria:</label>
          <select id="filter-category">
            <option value="Todos">Todos</option>
            <option value="Alimentos">Alimentos</option>
            <option value="Roupas">Roupas</option>
            <option value="Higiene">Higiene</option>
          </select>
        </div>

        <div>
          <label for="search-item">Buscar item:</label>
          <input type="text" id="search-item" placeholder="Digite para filtrar em tempo real" />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Quantidade</th>
          </tr>
        </thead>
        <tbody id="report-table"></tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2026 - Sistema de Assistência Social</p>
</footer>

<script src="login.js"></script>
<script src="sistema.js"></script>

</body>
</html>
<script>
// URL do servidor (ajuste se necessário)
const API_BASE = 'http://localhost:3000/api';

// Elementos do DOM
const loginSection = document.getElementById("login-section");
const systemSection = document.getElementById("system-section");
const inventoryDiv = document.getElementById("inventory-div");
const reportDiv = document.getElementById("report-div");
const inventoryTable = document.getElementById("inventory-table");
const reportTable = document.getElementById("report-table");

// Função para buscar itens do backend
async function fetchItems() {
  try {
    const response = await axios.get(`${API_BASE}/items`);
    return response.data;
  } catch (error) {
    console.error("Erro ao buscar itens:", error);
    return [];
  }
}

// Função para renderizar a tabela de inventário
async function renderInventory() {
  const items = await fetchItems();
  inventoryTable.innerHTML = "";

  items.forEach(item => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${item.name}</td>
      <td>${item.category}</td>
      <td>${item.quantity}</td>
      <td><button onclick="deleteItem(${item.id})" style="background:#e74c3c;">Excluir</button></td>
    `;
    inventoryTable.appendChild(tr);
  });
}

// Função para renderizar o relatório
async function renderReport() {
  const items = await fetchItems();
  const filterCategory = document.getElementById("filter-category").value;
  const searchText = document.getElementById("search-item").value.toLowerCase();

  const filtered = items.filter(item => {
    const matchCategory = filterCategory === "Todos" || item.category === filterCategory;
    const matchSearch = item.name.toLowerCase().includes(searchText);
    return matchCategory && matchSearch;
  });

  reportTable.innerHTML = "";
  filtered.forEach(item => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${item.name}</td>
      <td>${item.category}</td>
      <td>${item.quantity}</td>
    `;
    reportTable.appendChild(tr);
  });
}

// Função para deletar item
async function deleteItem(id) {
  try {
    await axios.delete(`${API_BASE}/items/${id}`);
    await renderInventory();
    await renderReport();
  } catch (error) {
    console.error("Erro ao deletar item:", error);
    alert("Erro ao deletar item.");
  }
}

// Login
document.getElementById("login-btn").addEventListener("click", async () => {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  try {
    const response = await axios.post(`${API_BASE}/auth/login`, {
      username: user,
      password: pass
    });

    if (response.data.success) {
      document.getElementById("login-error").classList.add("hidden");
      loginSection.classList.add("hidden");
      systemSection.classList.remove("hidden");
      await renderInventory();
      await renderReport();
    } else {
      document.getElementById("login-error").classList.remove("hidden");
    }
  } catch (error) {
    document.getElementById("login-error").classList.remove("hidden");
  }
});

// Logout
document.getElementById("btn-logout").addEventListener("click", () => {
  systemSection.classList.add("hidden");
  loginSection.classList.remove("hidden");
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
});

// Trocar entre abas
document.getElementById("btn-inventory").addEventListener("click", () => {
  inventoryDiv.classList.remove("hidden");
  reportDiv.classList.add("hidden");
  document.getElementById("btn-inventory").classList.add("active");
  document.getElementById("btn-report").classList.remove("active");
});

document.getElementById("btn-report").addEventListener("click", async () => {
  inventoryDiv.classList.add("hidden");
  reportDiv.classList.remove("hidden");
  document.getElementById("btn-report").classList.add("active");
  document.getElementById("btn-inventory").classList.remove("active");
  await renderReport();
});

// Salvar item
document.getElementById("save-item").addEventListener("click", async () => {
  const name = document.getElementById("item-name").value.trim();
  const category = document.getElementById("item-category").value;
  const quantity = document.getElementById("item-quantity").value.trim();

  if (!name || !quantity) {
    alert("Preencha nome e quantidade.");
    return;
  }

  try {
    await axios.post(`${API_BASE}/items`, {
      name,
      category,
      quantity
    });

    document.getElementById("item-name").value = "";
    document.getElementById("item-quantity").value = "";

    await renderInventory();
    await renderReport();
  } catch (error) {
    console.error("Erro ao salvar item:", error);
    alert("Erro ao salvar item.");
  }
});

// Filtrar relatório
document.getElementById("filter-category").addEventListener("change", renderReport);
document.getElementById("search-item").addEventListener("input", renderReport);

// Disponibilizar deleteItem globalmente
window.deleteItem = deleteItem;
</script>

</body>
</html>
